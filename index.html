<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wassel | Screen Sharing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة التحميل (محسنة وأفقية) -->
  <div id="splash-screen">
    <div class="splash-content">
      <!-- اللودر الجديد -->
      <h1 class="loader-text">Wassel</h1>
      <div class="spinner"></div>
      
      <p class="creator">FROM TAIMDEV9</p>
      <button id="btn-continue" class="btn btn-continue hidden">Continue</button>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div class="app hidden" id="main-app">
    
    <!-- كارت إشعار نجاح الاتصال -->
    <div id="success-toast" class="toast-container hidden">
      <div class="card">
        <div class="img"></div>
        <div class="textBox">
          <div class="textContent">
            <p class="h1" data-i18n="success_title">Connected!</p>
            <span class="span" data-i18n="success_status">Now</span>
          </div>
          <p class="p" data-i18n="success_desc">Devices are linked successfully.</p>
        </div>
      </div>
    </div>

    <!-- زر تغيير اللغة -->
    <button id="lang-toggle" class="lang-btn">عربي</button>

    <!-- شاشة الاختيار -->
    <section id="choose-screen" class="screen active">
      <h1 data-i18n="app_title">Wassel</h1>
      <p data-i18n="app_subtitle">Choose your device role</p>
      <div class="options">
        <button id="btn-host" class="option">
          <div class="icon">🎯</div>
          <h2 data-i18n="host_title">Target Device</h2>
          <p data-i18n="host_desc">Generates a code to be connected to</p>
        </button>
        <button id="btn-viewer" class="option">
          <div class="icon">🎮</div>
          <h2 data-i18n="viewer_title">Controller Device</h2>
          <p data-i18n="viewer_desc">Enter code to view/control the device</p>
        </button>
      </div>
    </section>

    <!-- شاشة المتصل به (Host) -->
    <section id="host-screen" class="screen">
      <button id="btn-back-host" class="btn-back">↩ <span data-i18n="back_btn">Back</span></button>
      <h1 data-i18n="host_screen_title">You are the Target</h1>
      <p data-i18n="host_screen_desc">Give this code to the controller (Click to copy):</p>
      <div class="code-display" id="code-display">------</div>
      <p class="status" id="host-status" data-i18n="waiting">Waiting for connection...</p>
      
      <video id="local-video" autoplay muted playsinline></video>
      
      <div class="host-controls">
        <input type="file" id="media-input" accept="image/*,video/*" class="hidden">
        <button id="btn-send-media" class="btn btn-media" data-i18n="send_media">📁 Send Image/Video</button>
        <button id="btn-stop-host" class="btn btn-secondary" data-i18n="stop_sharing">Stop Sharing</button>
      </div>
    </section>

    <!-- شاشة جهاز التحكم (Viewer) -->
    <section id="viewer-screen" class="screen">
      <button id="btn-back-viewer" class="btn-back">↩ <span data-i18n="back_btn">Back</span></button>
      <h1 data-i18n="viewer_screen_title">You are the Controller</h1>

      <div id="join-section">
        <p data-i18n="enter_code">Enter the 6-digit code to connect:</p>
        <input type="text" id="code-input" maxlength="6" inputmode="numeric"
               placeholder="000000" class="code-input" autocomplete="off">
        <button id="btn-connect" class="btn" data-i18n="connect_btn">Connect</button>
      </div>

      <div id="video-section" class="hidden">
        <video id="remote-video" autoplay playsinline></video>
        
        <div id="received-media-container" class="hidden">
          <h3 data-i18n="received_media">Received Media</h3>
          <img id="received-image" class="hidden" alt="Received Image">
          <video id="received-video" controls class="hidden"></video>
        </div>

        <button id="btn-back" class="btn btn-secondary" data-i18n="disconnect">Disconnect</button>
      </div>

      <p class="status" id="status"></p>
    </section>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
